<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">d8p OS operating architecture</title>
  <desc id="desc">Sixteen repositories arranged in four connected layers: governance and direction, input and output, domain applications, and shared platform and foundation.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b315b"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b15" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#c7f000"/>
    </marker>
    <style>
      .display{font-family:Arial,sans-serif;font-weight:750;fill:#f5ebce}
      .label{font-family:Arial,sans-serif;font-weight:700;fill:#ffffff;letter-spacing:.8px}
      .repo{font-family:Arial,sans-serif;font-weight:700;fill:#ffffff}
      .desc{font-family:Arial,sans-serif;font-weight:450;fill:#b9d6ea}
      .layer{fill:#0b2747;stroke:#2e79ad;stroke-width:1.5}
      .card{fill:#10385f;stroke:#2e79ad;stroke-width:1.5}
      .card-accent{fill:#0d416f;stroke:#c7f000;stroke-width:2}
    </style>
  </defs>

  <rect width="1440" height="1100" rx="28" fill="url(#canvas)"/>
  <circle cx="1250" cy="-20" r="260" fill="#ffffff" opacity="0.035"/>
  <circle cx="1180" cy="80" r="150" fill="#0077b5" opacity="0.12"/>
  <text x="72" y="72" class="display" font-size="38">d8p OS operating architecture</text>
  <text x="72" y="106" class="desc" font-size="18">Sixteen focused repositories, one governed product</text>
  <line x1="72" y1="124" x2="1368" y2="124" stroke="#c7f000" stroke-width="3"/>

  <line x1="115" y1="200" x2="115" y2="952" stroke="#2e79ad" stroke-width="3"/>
  <circle cx="115" cy="200" r="8" fill="#c7f000"/>
  <circle cx="115" cy="375" r="8" fill="#c7f000"/>
  <circle cx="115" cy="625" r="8" fill="#c7f000"/>
  <circle cx="115" cy="900" r="8" fill="#c7f000"/>
  <text x="64" y="594" class="label" font-size="15" transform="rotate(-90 64 594)">DIRECTION → DELIVERY → DOMAINS → FOUNDATION</text>

  <rect x="170" y="150" width="1198" height="132" rx="18" class="layer"/>
  <text x="198" y="184" class="label" font-size="16">GOVERNANCE AND DIRECTION</text>
  <line x1="198" y1="196" x2="390" y2="196" stroke="#c7f000" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="430" y="207" width="680" height="54" rx="12" class="card-accent"/>
    <text x="454" y="232" class="repo" font-size="21">d8p-management</text>
    <text x="454" y="251" class="desc" font-size="14">Priorities · decisions · queue · operating policy</text>
  </g>

  <path d="M769 282V302" stroke="#c7f000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="315" width="1198" height="150" rx="18" class="layer"/>
  <text x="198" y="349" class="label" font-size="16">INPUT AND OUTPUT</text>
  <line x1="198" y1="361" x2="344" y2="361" stroke="#c7f000" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="288" y="376" width="405" height="66" rx="12" class="card"/>
    <text x="312" y="403" class="repo" font-size="20">d8p-creative</text>
    <text x="312" y="426" class="desc" font-size="14">Design · case studies · publishable work</text>
    <rect x="845" y="376" width="405" height="66" rx="12" class="card"/>
    <text x="869" y="403" class="repo" font-size="20">d8p-newsroom</text>
    <text x="869" y="426" class="desc" font-size="14">Editorial intake · stories · publishing flow</text>
  </g>

  <path d="M769 465V485" stroke="#c7f000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="498" width="1198" height="270" rx="18" class="layer"/>
  <text x="198" y="532" class="label" font-size="16">DOMAIN APPLICATIONS</text>
  <line x1="198" y1="544" x2="366" y2="544" stroke="#c7f000" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="205" y="560" width="260" height="76" rx="12" class="card"/>
    <text x="224" y="587" class="repo" font-size="18">d8p-career</text>
    <text x="224" y="611" class="desc" font-size="13">Career strategy · opportunities</text>
    <rect x="490" y="560" width="260" height="76" rx="12" class="card"/>
    <text x="509" y="587" class="repo" font-size="18">d8p-financehome</text>
    <text x="509" y="611" class="desc" font-size="13">Money · home records</text>
    <rect x="775" y="560" width="260" height="76" rx="12" class="card"/>
    <text x="794" y="587" class="repo" font-size="17">d8p-financehome-groceries</text>
    <text x="794" y="611" class="desc" font-size="13">Shopping intent · grocery flow</text>
    <rect x="1060" y="560" width="260" height="76" rx="12" class="card"/>
    <text x="1079" y="587" class="repo" font-size="18">d8p-healthfitness</text>
    <text x="1079" y="611" class="desc" font-size="13">Health · fitness · lessons</text>
    <rect x="348" y="658" width="260" height="76" rx="12" class="card"/>
    <text x="367" y="685" class="repo" font-size="18">d8p-music</text>
    <text x="367" y="709" class="desc" font-size="13">Listening · playlists · discovery</text>
    <rect x="633" y="658" width="260" height="76" rx="12" class="card"/>
    <text x="652" y="685" class="repo" font-size="18">d8p-family</text>
    <text x="652" y="709" class="desc" font-size="13">Family coordination · records</text>
    <rect x="918" y="658" width="260" height="76" rx="12" class="card"/>
    <text x="937" y="685" class="repo" font-size="18">d8p-companion</text>
    <text x="937" y="709" class="desc" font-size="13">Conversational workflow surface</text>
  </g>

  <path d="M769 768V788" stroke="#c7f000" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="800" width="1198" height="242" rx="18" class="layer"/>
  <text x="198" y="834" class="label" font-size="16">SHARED PLATFORM AND FOUNDATION</text>
  <line x1="198" y1="846" x2="472" y2="846" stroke="#c7f000" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="250" y="862" width="320" height="66" rx="12" class="card"/>
    <text x="271" y="889" class="repo" font-size="18">d8p-knowledge</text>
    <text x="271" y="912" class="desc" font-size="13">Governed vault · durable memory</text>
    <rect x="610" y="862" width="320" height="66" rx="12" class="card"/>
    <text x="631" y="889" class="repo" font-size="18">d8p-skills</text>
    <text x="631" y="912" class="desc" font-size="13">Reusable capability contracts</text>
    <rect x="970" y="862" width="320" height="66" rx="12" class="card"/>
    <text x="991" y="889" class="repo" font-size="18">d8p-admin</text>
    <text x="991" y="912" class="desc" font-size="13">Mail · calendar · tasks · rituals</text>
    <rect x="250" y="950" width="320" height="66" rx="12" class="card"/>
    <text x="271" y="977" class="repo" font-size="18">d8p-orchestrator</text>
    <text x="271" y="1000" class="desc" font-size="13">Cross-repository work routing</text>
    <rect x="610" y="950" width="320" height="66" rx="12" class="card"/>
    <text x="631" y="977" class="repo" font-size="18">d8p-scaffold</text>
    <text x="631" y="1000" class="desc" font-size="13">Blueprints · baselines · conformance</text>
    <rect x="970" y="950" width="320" height="66" rx="12" class="card"/>
    <text x="991" y="977" class="repo" font-size="18">d8p-obsidian-vault</text>
    <text x="991" y="1000" class="desc" font-size="13">Legacy vault boundary · transition</text>
  </g>

  <text x="170" y="1074" class="desc" font-size="15">Management governs every layer · Domain work promotes durable knowledge · Shared services support every application</text>
</svg>
